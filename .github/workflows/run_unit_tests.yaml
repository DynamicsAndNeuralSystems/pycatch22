name: Unit Testing Pipeline

on:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install pycatch22
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Check pycatch22 works without numpy
        run: |
          python -c "import pycatch22; print(pycatch22.catch22_all([1.0, 3.0, 2.0, 5.0, 4.0, 6.0, 5.0, 7.0, 6.0, 8.0])['values'][0])"
      - name: Install test dependencies
        run: |
          pip install pytest numpy
      - name: Run basic unit tests
        run: |
          pytest -v ./tests/unit_tests.py
      - name: Run feature benchmarking tests
        run: |
          pytest -v ./tests/test_features.py
      - name: Profile performance vs. time series length
        run: |
          python ./tests/profile_performance.py --min-exp 0 --max-exp 5 --repeats 3

  sdist:
    # the sdist builds pycatch22 and runs its tests on its own, and stays small
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist .
      - name: Check its size (under 1 MB)
        run: |
          ls -l dist
          test $(stat -c %s dist/*.tar.gz) -lt 1000000
      - name: Install it and run the tests from the unpacked sdist
        run: |
          pip install dist/*.tar.gz pytest numpy
          mkdir unpacked && tar xzf dist/*.tar.gz -C unpacked
          cd unpacked/pycatch22-*
          pytest -v tests/unit_tests.py tests/test_features.py
