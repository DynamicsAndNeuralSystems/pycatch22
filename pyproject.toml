[project]
name = "pycatch22"
version = "1.0.1"
authors = [
    {name = "Carl H Lubba", email = "carl.lubba@gmx.de"},
]
maintainers = [
    {name = "Ben D Fulcher", email = "ben.fulcher@sydney.edu.au"},
]
description = "22 CAnonical Time-series Features"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GNU General Public License v3 (GPLv3)"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
"GitHub Repository (pycatch22)" = "https://github.com/DynamicsAndNeuralSystems/pycatch22"
"Mother Repository (catch22)" = "https://github.com/DynamicsAndNeuralSystems/catch22"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Wheels for every CPython that cibuildwheel supports (3.9 and later); Python 3.8
# installs from the sdist. Free-threaded builds are skipped until the C extension
# declares that it doesn't need the GIL.
skip = "*t-*"
# Each wheel is tested against catch22's expected outputs (all test series)
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests/unit_tests.py {project}/tests/test_features.py"

[tool.cibuildwheel.macos]
# Intel and Apple Silicon, both built on an Apple Silicon runner
archs = ["x86_64", "arm64"]
